name: Validate Minnieverse

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check script.js
      - name: Guard against single-element selector iteration bugs
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          source = Path("script.js").read_text(encoding="utf-8")
          bad = re.findall(r'(?<!\$)\$\([^)]*\)\.forEach\s*\(', source)
          if bad:
              raise SystemExit("Use $$(...) for NodeList iteration, not $(...): " + repr(bad))
          print("Selector iteration check passed.")
          PY
      - name: Verify local soundtrack files are decodable MP3s
        run: |
          set -euo pipefail
          files=(
            assets/audio/doraemon.mp3
            assets/audio/tame-impala.mp3
            assets/audio/maneskin-beggin.mp3
            assets/audio/maneskin-i-wanna-be-your-slave.mp3
          )
          for file in "${files[@]}"; do
            test -s "$file" || { echo "Missing or empty soundtrack file: $file"; exit 1; }
            echo "Checking $file ($(stat -c%s "$file") bytes)"
            if ! command -v ffprobe >/dev/null 2>&1; then
              echo "ffprobe is unavailable on this runner"
              file "$file"
              python - "$file" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          with p.open("rb") as f:
              head = f.read(16)
          valid = head.startswith(b"ID3") or (len(head) >= 2 and head[0] == 0xff and (head[1] & 0xe0) == 0xe0)
          print(f"header={head.hex()} likely_mp3={valid}")
          if not valid:
              raise SystemExit(f"{p} does not have an MP3 frame/ID3 header")
          PY
            else
              ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -show_entries format=duration -of default=noprint_wrappers=1 "$file"
              ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$file" | grep -qx mp3
            fi
          done
      - name: Validate custom player controls and soundtrack paths
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class PlayerParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
                  self.track_sources = []
                  self.native_audio_controls = False
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if attrs.get("id"):
                      self.ids.add(attrs["id"])
                  if attrs.get("data-audio-src"):
                      self.track_sources.append(attrs["data-audio-src"])
                  if tag == "audio" and "controls" in attrs:
                      self.native_audio_controls = True

          parser = PlayerParser()
          html = Path("index.html").read_text(encoding="utf-8")
          parser.feed(html)
          required = {
              "musicPlayer", "localAudio", "recordDisc", "recordLabelSymbol",
              "playerSongTitle", "playerSongArtist", "playerTrackIndex", "playerMode",
              "playerPlayButton", "playerPlayIcon", "playerPrevious", "playerNext",
              "playerMuteButton", "audioSeek", "audioElapsed", "audioDuration", "audioVolume",
              "audioStatus"
          }
          missing = sorted(required - parser.ids)
          if missing:
              raise SystemExit("Custom audio player is missing IDs: " + ", ".join(missing))
          if parser.native_audio_controls:
              raise SystemExit("Use custom-styled player controls, not native audio controls.")
          if len(parser.track_sources) != 4:
              raise SystemExit(f"Expected 4 local soundtrack buttons, found {len(parser.track_sources)}")
          for src in parser.track_sources:
              path = Path(src.removeprefix("./"))
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing/empty MP3 for a track button: {src}")
          print("Custom player IDs, four local MP3 paths, and no external/native player controls verified.")
          PY
      - name: Check referenced local assets
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  for attr in ("src", "href"):
                      value = attrs.get(attr, "")
                      if value.startswith("./assets/"):
                          self.refs.append(value[2:])
          parser = PageParser()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          missing = [ref for ref in parser.refs if not Path(ref).is_file()]
          if missing:
              raise SystemExit("Missing local assets: " + ", ".join(missing))
          if Path("index.html").stat().st_size < 5000:
              raise SystemExit("index.html looks unexpectedly small")
          print(f"Checked {len(parser.refs)} local asset references.")
          PY
